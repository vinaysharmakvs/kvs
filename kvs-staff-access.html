<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <title>Kidsverse Staff Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0ZT634EM99"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-0ZT634EM99');
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="staff-login-page">
    <main class="staff-login-shell" aria-label="Kidsverse private login">
      <section class="staff-login-card">
        <div class="staff-login-brand">
          <img src="assets/logo.png" alt="Kidsverse School logo" />
          <div>
            <p class="eyebrow">Private access</p>
            <h1>Kidsverse Staff Login</h1>
          </div>
        </div>

        <p class="staff-login-copy">
          This page is for authorised Kidsverse team members only. Please continue with the approved Google account.
        </p>

        <div
          id="g_id_onload"
          data-client_id="344047535994-9a2s1tl3kf9etkkht33ciba13f32k5b8.apps.googleusercontent.com"
          data-callback="handleKidsverseGoogleLogin"
          data-auto_prompt="false"
          data-ux_mode="popup"
          data-context="signin"
          data-itp_support="true"
          data-use_fedcm_for_prompt="true"
        ></div>
        <div
          class="g_id_signin"
          data-type="standard"
          data-size="large"
          data-theme="outline"
          data-text="signin_with"
          data-shape="pill"
          data-logo_alignment="left"
        ></div>

        <div class="staff-login-result" data-login-result hidden></div>
        <div class="staff-login-alert" data-login-alert hidden></div>
        <p class="staff-login-note">
          For privacy, this page is intentionally not shown in the Kidsverse website menu.
        </p>
      </section>
    </main>

    <script>
      function decodeKidsverseCredential(token) {
        const payload = token.split(".")[1] || "";
        const base64 = payload.replace(/-/g, "+").replace(/_/g, "/");
        const decoded = atob(base64);
        return JSON.parse(decodeURIComponent(Array.from(decoded).map((character) => {
          return "%" + ("00" + character.charCodeAt(0).toString(16)).slice(-2);
        }).join("")));
      }

      async function saveKidsverseLoginAudit(credential) {
        const auditPayload = {
          credential,
          sourceApp: "kidsverse-staff-access",
          device: {
            pageUrl: window.location.href,
            origin: window.location.origin,
            userAgent: navigator.userAgent,
            language: navigator.language,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            screenSize: `${window.screen.width}x${window.screen.height}`,
            platform: navigator.platform
          }
        };

        const auditResponse = await fetch("/api/staff-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(auditPayload)
        });
        const auditData = await auditResponse.json().catch(() => ({}));
        if (!auditResponse.ok || !auditData.ok) {
          throw new Error(auditData.error || "Login saved locally, but database audit failed.");
        }
        return auditData.record;
      }

      async function handleKidsverseGoogleLogin(response) {
        const result = document.querySelector("[data-login-result]");
        try {
          const profile = decodeKidsverseCredential(response.credential);
          const loginRecord = {
            name: profile.name || "Kidsverse team member",
            email: profile.email || "",
            picture: profile.picture || "",
            signedInAt: new Date().toISOString()
          };
          sessionStorage.setItem("kidsverseStaffLogin", JSON.stringify(loginRecord));
          result.hidden = false;
          result.innerHTML = `
            <span>Saving secure login record...</span>
            <strong>${loginRecord.name}</strong>
            <small>${loginRecord.email}</small>
          `;
          const savedRecord = await saveKidsverseLoginAudit(response.credential);
          result.innerHTML = `
            <span>Signed in and recorded successfully</span>
            <strong>${savedRecord.name || loginRecord.name}</strong>
            <small>${savedRecord.email || loginRecord.email}</small>
          `;
        } catch (error) {
          result.hidden = false;
          result.innerHTML = `<span>${error.message || "Login received, but profile could not be saved. Please try again."}</span>`;
        }
      }

      const loginAlert = document.querySelector("[data-login-alert]");
      const allowedOrigins = ["https://www.kidsverseschool.com", "https://kidsverseschool.com"];
      if (window.location.protocol !== "https:" && window.location.hostname !== "localhost") {
        loginAlert.hidden = false;
        loginAlert.textContent = "Google login works only on the secure live website, not from a local file preview.";
      } else if (!allowedOrigins.includes(window.location.origin) && window.location.hostname !== "localhost") {
        loginAlert.hidden = false;
        loginAlert.textContent = `This domain must be added in Google Cloud OAuth settings: ${window.location.origin}`;
      }
    </script>
  </body>
</html>
